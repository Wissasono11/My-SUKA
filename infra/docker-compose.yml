# docker compose --env-file ../.env.production -f infra/docker-compose.yml up -d --build
services:
  portal-api:
    build: ../portal-api
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:?isi REDIS_PASSWORD di .env.production (openssl rand -hex 32)}@redis:6379/0
    expose: ["8000"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # Sesi, kode otorisasi sekali pakai, dan rate limit. Hanya di memori (tanpa RDB/AOF): data ini memuat identitas
  # pengguna dan tidak boleh tertulis ke disk. Tidak dipublikasikan ke host; hanya portal-api yang dapat menjangkaunya.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs: ["/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  portal-web:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      ENV: production
      API_INTERNAL_URL: http://portal-api:8000
      SSO_JWKS_URL: http://portal-api:8000/.well-known/jwks.json
    expose: ["3000"]
    depends_on:
      portal-api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../.env.production
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [portal-web, portal-api]

volumes:
  caddy_data:
  caddy_config:
